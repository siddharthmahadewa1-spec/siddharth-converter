name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unzip project
        run: unzip -q siddharth-converter.zip
      - name: Install and set up
        working-directory: siddharth-converter
        run: |
          npm install
          npx cap add android
          npm run native
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Build APK
        working-directory: siddharth-converter/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Siddharth-Converter-APK
          path: siddharth-converter/android/app/build/outputs/apk/debug/*.apk
